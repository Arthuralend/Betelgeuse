[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libp2p = { version = "=0.56.0", default-features = false, features = [
  "tokio", "tcp", "quic", "noise", "yamux", "dns", "kad", "identify",
  "mdns", "ping", "request-response", "cbor", "macros", "ed25519",
  "relay", "dcutr", "autonat"
] }
libp2p-core = "=0.43.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "signal", "time"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
zeroize = "1.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
