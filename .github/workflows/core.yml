name: Rust / libp2p core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Linux - build and two-node acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install QR decode tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin zbar-tools
      - name: Resolve dependencies
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo fetch --locked
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Compile CLI
        run: cargo build --locked -p betelgeuse
      - name: Run two independent peers and decode QR
        run: python3 tests/two_nodes.py --require-qr
      - name: Three peers through Circuit Relay v2
        run: python3 tests/relay_nodes.py
      - name: Package executable and lockfile
        run: cargo build --locked --release -p betelgeuse
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-cli-linux
          path: |
            target/release/betelgeuse
            Cargo.lock

  macos:
    name: macOS - build
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: betelgeuse-cli-linux
          path: linux-ci
      - name: Use tested lockfile
        run: cp linux-ci/Cargo.lock Cargo.lock
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Compile and test on macOS
        run: |
          cargo test --locked --workspace
          cargo build --locked -p betelgeuse
          python3 tests/two_nodes.py
          cargo build --locked --release -p betelgeuse
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-cli-macos
          path: |
            target/release/betelgeuse
            Cargo.lock
