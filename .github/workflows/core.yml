name: Rust / libp2p core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Linux - build and two-node acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Install QR decode tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin zbar-tools
      - name: Resolve dependencies
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo fetch --locked
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: Compile CLI
        run: cargo build --locked -p betelgeuse
      - name: Run two independent peers and decode QR
        run: python3 tests/two_nodes.py --require-qr
      - name: Three peers through Circuit Relay v2
        run: python3 tests/relay_nodes.py
      - name: Signaling and file transfer between real peers
        run: python3 tests/exchange_nodes.py
      - name: Package executable and lockfile
        run: cargo build --locked --release -p betelgeuse
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-cli-linux
          path: |
            target/release/betelgeuse
            Cargo.lock

  macos:
    name: macOS - build
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: betelgeuse-cli-linux
          path: linux-ci
      - name: Use tested lockfile
        run: cp linux-ci/Cargo.lock Cargo.lock
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Compile and test on macOS
        run: |
          cargo test --locked --workspace
          cargo build --locked -p betelgeuse
          python3 tests/two_nodes.py
          cargo build --locked --release -p betelgeuse
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-cli-macos
          path: |
            target/release/betelgeuse
            Cargo.lock

  ios:
    if: github.ref == 'refs/heads/main'
    name: iOS IPA and XCFramework
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS 26 SDK
        run: |
          developer_dir="$(python3 - <<'PYX'
          from pathlib import Path
          def version(p):
              import re
              return tuple(map(int, re.findall(r'\d+', p.name)))
          apps = sorted(Path('/Applications').glob('Xcode_26*.app'), key=version)
          if not apps:
              raise SystemExit('Xcode 26 is not installed on this runner')
          print(apps[-1] / 'Contents/Developer')
          PYX
          )"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - name: Build Rust XCFramework and iPhone package
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betelgeuse-xcframework
          path: dist/Betelgeuse-Core.xcframework/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-ios
          path: dist/Betelgeuse-0.7.0-iPhone-unsigned.ipa
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/main'
    name: Android JNI and APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools"
      - name: Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build JNI and APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: betelgeuse-android
          path: dist/Betelgeuse-0.7.0-Android-unsigned.apk
          if-no-files-found: error

  media:
    name: WebRTC synthetic media acceptance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: betelgeuse-cli-linux
          path: linux-ci
      - name: Test bidirectional decoded video and received audio
        run: |
          chmod +x linux-ci/target/release/betelgeuse
          google-chrome --version
          python3 tests/webrtc_media.py --binary linux-ci/target/release/betelgeuse
